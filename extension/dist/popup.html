<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OmaLLDownloader</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>OmaLLDownloader</h1>
    <span id="status" class="status" data-state="unknown">…</span>
  </header>

  <section id="offline" hidden>
    <p id="reason" class="hint"></p>
    <p class="hint">
      Downloads go to the browser while the app is closed. Start it and this page
      reconnects by itself.
    </p>
    <button id="open-app" class="primary">Open OmaLLDownloader</button>
    <label for="address">Address</label>
    <input id="address" type="text" spellcheck="false" />
    <button id="reconnect" class="secondary">Reconnect</button>
    <p id="pair-error" class="error" hidden></p>
  </section>

  <section id="connected" hidden>
    <p id="summary" class="summary"></p>
    <ul id="tasks" class="tasks"></ul>
    <p id="no-tasks" class="hint" hidden>No downloads yet.</p>
  </section>

  <section>
    <label class="switch">
      <input id="take-all" type="checkbox" />
      <span>Take downloads from the browser</span>
    </label>
    <label for="min-size">Only files larger than (KB)</label>
    <input id="min-size" type="number" min="0" step="128" />
    <label for="skip">Leave these extensions to the browser</label>
    <input id="skip" type="text" placeholder="html,txt" spellcheck="false" />
  </section>

  <footer>
    <button id="send-page" class="secondary">Send this page</button>
    <button id="reset" class="link" hidden>Forget this browser</button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
