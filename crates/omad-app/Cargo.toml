[package]
name = "omad-app"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
description = "OmaLLDownloader desktop application (ODK/GPUI)"

[[bin]]
name = "omalldownloader"
path = "src/main.rs"

[dependencies]
omad-core.workspace = true
omad-engine.workspace = true
omad-store.workspace = true
omad-rpc.workspace = true
# ODK is not on crates.io and is pre-release: pinned to the commit this app was built
# against. Bump deliberately and re-run the tests; ADP: one facade crate (ODK ADR 0028).
odk = { path = "../../vendor/odk/crates/odk" }
tokio.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

# The view's tests live in `omad-app-tests`: GPUI's `test-support` feature changes how the
# runtime starts, and a dev-dependency would turn it on for the shipped binary too.
