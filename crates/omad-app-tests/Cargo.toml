[package]
name = "omad-app-tests"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
publish = false
description = "The window's tests. A crate of their own so that `odk`'s test-support feature never reaches the shipped binary (it changes how GPUI starts)"

[dependencies]
omad-app.workspace = true
omad-core.workspace = true
omad-engine.workspace = true
omad-store.workspace = true
gpui = { version = "=0.2.2", features = ["test-support"] }
odk = { git = "https://github.com/csfh/odk", rev = "8e8f2d25c1e76e7dbcb2d811c6ccc7a8db795289", features = ["test-support"] }
