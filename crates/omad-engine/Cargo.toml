[package]
name = "omad-engine"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
description = "OmaLLDownloader download engine: chunked HTTP with resume"

[dependencies]
omad-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
url.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
futures-util.workspace = true
bytes.workspace = true

# The BitTorrent side: a pure-Rust client, so a magnet link needs no daemon and no external
# binary on any of the three platforms. DHT and trackers are on by default, which is what
# makes a magnet link work at all.
librqbit = { version = "9", default-features = false, features = ["default-tls"] }
# A DASH manifest is XML with templates; reading it with a real parser is shorter and
# safer than scanning for substrings.
quick-xml = "0.41"

[dev-dependencies]
tempfile.workspace = true
