[workspace]
resolver = "3"
members = [
  "crates/omad-core",
  "crates/omad-store",
  "crates/omad-engine",
  "crates/omad-rpc",
  "crates/omad-app",
  "crates/omad-cli",
  "crates/omad-app-tests",
]
exclude = []

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT"
version = "1.0.0"

[workspace.dependencies]
omad-core = { path = "crates/omad-core" }
omad-store = { path = "crates/omad-store" }
omad-engine = { path = "crates/omad-engine" }
omad-rpc = { path = "crates/omad-rpc" }
omad-app = { path = "crates/omad-app" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "sync", "time", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.41", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream", "gzip", "brotli", "deflate"] }
url = "2"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
hmac = "0.12"
rand = "0.9"
base64 = "0.22"
bytes = "1"
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# GPUI 0.2.2 does not compile on Linux without a patched `xattr` (libc dropped ENOATTR
# there); see ODK's patches/README.md and its ADR 0029. ODK's patch redefines ENOATTR on
# macOS, where libc still has it, so the copy in `vendor/xattr` carries the one-line fix that
# keeps both platforms compiling.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
